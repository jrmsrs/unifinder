<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
      name="viewport"
    />
    <meta name="theme-color" content="#706f6f1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="scroll" class="scroll-wrapper">%sveltekit.body%</div>
    <script>
      if (/mobile|android|touch|ipad|iphone|ipod/.test(navigator.userAgent.toLowerCase()))
        document.body.classList.add('touch-device');
    </script>
  </body>
  <style>
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overscroll-behavior-y: contain;
      overflow: hidden;
    }

    .scroll-wrapper {
      height: 100%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</html>
